# Existing vrpn_to_pose -> G1 UDP bridge on 192.168.152.200.
# Converter outputs are already metres and already include robot_side=P2.
# Observed labels differ; these checks do not perform a TF lookup.
# Operator-confirmed upstream mocap calibration already outputs pelvis.
# Raw marker -> pelvis offset [0.011898400, 0.000002657, 0.086323220] m and
# identity orientation are accounted for upstream. Keep downstream correction
# zero/identity to avoid applying that offset twice.
# The common table/world convention is a separate coordinate transform.
source:
  ball_topic: /poses
  ball_type: pose_array
  ball_pose_index: 0
  root_topic: /P1/pose
  frame: world
  ball_frame: world
  root_frame: map
ball_topic: /ball/point
root_topic: /P1/pose
world_frame: world
transport: udp
udp: {host: 127.0.0.1, port: 15050}
source_clock_offset: 0.0
source_max_age: 0.15
transform:
  scale: 1.0
  quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  translation: [0.0, 0.0, 0.0]
root_marker_to_pelvis: [0.0, 0.0, 0.0]  # Input already represents pelvis.
root_marker_to_pelvis_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
root_stale_timeout: 0.1
estimator:
  window: 9
  max_gap: 0.1
  stale_timeout: 0.1
