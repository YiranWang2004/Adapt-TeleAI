# Existing HOPE terminals 1+2 -> this project's bridge (terminal 3).
# Explicit source schema; no runtime topic discovery or marker auto-selection.
source:
  ball_topic: /poses
  ball_type: pose_array  # Alternatives: point_stamped or pose_stamped
  ball_pose_index: 0    # HOPE planner default; confirm vrpn_to_pose ordering.
  root_topic: /P1/pose  # Use actual robot output, NOT inferred from robot_side.
  frame: world         # Must match the converter's header.frame_id.
ball_topic: /ball/point
root_topic: /P1/pose
world_frame: world
transport: udp
udp: {host: 127.0.0.1, port: 15050}
source_clock_offset: 0.0
source_max_age: 0.15
# HOPE tabletop z=0 -> G1 ground world tabletop z=0.76.
# This example assumes XY axes/origins already agree. Calibrate XY/yaw against
# the G1 table: near edge x=0.65, far edge x=3.39; do not transform twice.
transform:
  scale: 1.0
  quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  translation: [0.0, 0.0, 0.76]
# Body-frame offset from tracked G1 rigid-body origin to pelvis, to be measured.
root_marker_to_pelvis: [0.0, 0.0, 0.0]
root_marker_to_pelvis_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
root_stale_timeout: 0.1
estimator:
  window: 9
  max_gap: 0.1
  stale_timeout: 0.1
