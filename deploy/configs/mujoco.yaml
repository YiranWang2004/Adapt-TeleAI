# Python HOPE-style rally: fixed home -> select at trigger -> return home.
ready_seconds: 0.0
motion_allow: [19, 24]  # Baseline model long-sequence validated set; home=19.
return_blend_seconds: 0.0  # HOPE --fixed-world-home --no-return-blend
# Reproducible baseline, NOT a claim of validated continuous deployment.
# observed_terminal is an experimental Stage2->Stage1 tail handoff.
stage2_tail_mode: full
max_intercept_distance: 0.25
max_start_frame: 30
selection_hysteresis: 0.05
feed:
  # Coverage is sampled from the allowed reference strike region. The sampled
  # reference is never passed to the selector; it sees ball positions only.
  speed_range: [2.0, 2.5]
  lateral_speed_range: [-0.1, 0.1]
  intercept_jitter: [0.008, 0.008, 0.004]
  serve_gap_seconds: 0.0  # Legacy evaluator only.
  interval_seconds: 2.0   # Independent continuous feeder; never waits for stance.
