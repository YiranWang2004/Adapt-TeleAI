# Avatar-Pro / Chingmu CMTracker -> external vrpn_mocap -> this relay.
# Start vrpn_mocap separately with the actual server IP/port (normally 3883).
# Set these two raw topic names to the labels in your mocap server.
vrpn_ball_topic: /vrpn_mocap/Ball/pose
vrpn_root_topic: /vrpn_mocap/P1/pose
ball_topic: /ball/point
root_topic: /P1/pose
world_frame: world
transport: udp
udp: {host: 127.0.0.1, port: 15050}
# Correct measured source-clock offset before deployment; seconds.
source_clock_offset: 0.0
source_max_age: 0.15

# T_training_world_from_mocap_world. No implicit axis swapping.
# Input position is converted to meters, then rotated and translated.
transform:
  scale: 1.0
  quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  translation: [0.0, 0.0, 0.0]

# Body-frame vector from the tracked rigid-body origin to pelvis origin.
# The rigid body's orientation must also be calibrated to the pelvis axes.
root_marker_to_pelvis: [0.0, 0.0, 0.0]
root_marker_to_pelvis_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
root_stale_timeout: 0.1
estimator:
  window: 9
  max_gap: 0.1
  stale_timeout: 0.1
