world_frame: hope_table
evaluation_mode: policy_tracking  # Stage 1: no ball generation and no ball planner.
domain_file: deploy/hope_g1/configs/command_domain.json
# Domain snapshot overrides the fallback bounds/vectors below.
# Fallback ranges are only used with --unrestricted or a config without a domain.
plane_x: -0.25
y_range: [-1.4, -0.15]
z_range: [-0.10, 0.65]
grid: [8, 6]  # Y columns, Z rows
crop_bottom_z_rows: 1  # Remove lowest original row; keep remaining cell boundaries.
samples_per_cell: 20
position_sampling: fixed_per_cell
sweep:
  directions: 5
  speed_levels: 2
  tts_levels: 2
seed: 42
rally_constraints:
  enabled: true
  landing_margin: 0.10  # First landing at least 10cm inside the opponent half.
  net_clearance: 0.03   # Ball bottom at least 3cm above net.
  outgoing_speed_range: [2.0, 12.0]
  incoming_bank_size: 8
  max_direction_attempts: 256
  speed_probe_levels: 61
  minimum_speed_span: 0.30  # Keep multi-speed tests meaningfully different.
normal_yaw_degrees: [-30.0, 30.0]
normal_pitch_degrees: [-10.0, 35.0]
speed_mps: [0.5, 2.5]
tts_seconds: [0.30, 0.50]
shuffle: true
episode_seconds: 4.5
display_hold_seconds: 0.6
physical_ball:
  gravity: 9.81
  drag: 0.1537
  ball_radius: 0.02
  racket_radius: 0.075
  racket_restitution: 0.88
  table_restitution: 1.01
  table_tangential_damping: 0.69
  table_near_x: 0.0
  table_far_x: 2.74
  table_center_y: -0.7625
  table_width: 1.525
  table_height: 0.0
  net_height: 0.1525
  net_overhang: 0.15
  floor_height: -0.76
  incoming_speed_range: [2.0, 3.5]
  incoming_downward_speed_range: [1.0, 4.5]
  attempts: 64
tolerances:
  position_m: 0.05
  normal_degrees: 15.0
  velocity_mps: 0.5
  timing_seconds: 0.04
